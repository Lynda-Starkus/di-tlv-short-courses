<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Data lives and lineage">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">Where does the data live?</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">For LLM tuning and evaluation, the scalable pattern is: transform near the data, export artifacts, pass</tspan>
<tspan x="70" dy="24">locations downstream.</tspan>
</text><ellipse cx="230" cy="230" rx="140" ry="45" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
<path d="M90 230 V470 C90 535 370 535 370 470 V230" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
<ellipse cx="230" cy="470" rx="140" ry="45" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
<text x="230" y="315" class="label" text-anchor="middle">
<tspan x="230" dy="0">Data warehouse</tspan>
<tspan x="230" dy="24">SQL tables</tspan>
</text><rect x="155" y="365" width="150" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="230" y="388" class="tiny" text-anchor="middle">
<tspan x="230" dy="0">tickets</tspan>
</text><rect x="155" y="410" width="150" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="230" y="433" class="tiny" text-anchor="middle">
<tspan x="230" dy="0">answers</tspan>
</text><rect x="155" y="455" width="150" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="230" y="478" class="tiny" text-anchor="middle">
<tspan x="230" dy="0">metadata</tspan>
</text><rect x="505" y="300" width="210" height="110" rx="18" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
<text x="610.0" y="351.0" class="label" text-anchor="middle">
<tspan x="610.0" dy="0">Object storage</tspan>
<tspan x="610.0" dy="20">JSONL / Parquet</tspan>
<tspan x="610.0" dy="20">files</tspan>
</text><rect x="835" y="300" width="220" height="110" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="945.0" y="351.0" class="label" text-anchor="middle">
<tspan x="945.0" dy="0">Training /</tspan>
<tspan x="945.0" dy="20">evaluation</tspan>
<tspan x="945.0" dy="20">reads by URI</tspan>
</text><line x1="375" y1="360" x2="495" y2="360" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="720" y1="360" x2="825" y2="360" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="110" y="590" width="980" height="55" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="600" y="625" class="label" text-anchor="middle">
<tspan x="600" dy="0">Data lineage: source table + query + timestamp + file checksum + owner</tspan>
</text><line x1="230" y1="520" x2="230" y2="590" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="610" y1="410" x2="610" y2="590" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="945" y1="410" x2="945" y2="590" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/></svg>
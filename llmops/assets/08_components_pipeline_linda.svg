<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Components and pipelines">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">Components are steps. A pipeline is their dependency graph.</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">A beginner-friendly pipeline can start with normal Python functions. The key idea is how outputs flow</tspan>
<tspan x="70" dy="24">downstream.</tspan>
</text><rect x="170" y="210" width="190" height="70" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="265.0" y="241.0" class="mono" text-anchor="middle">
<tspan x="265.0" dy="0">&quot;Linda&quot;</tspan>
</text><rect x="170" y="340" width="260" height="80" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="300.0" y="376.0" class="mono" text-anchor="middle">
<tspan x="300.0" dy="0">greet_customer()</tspan>
</text><rect x="500" y="340" width="250" height="90" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="381.0" class="mono" text-anchor="middle">
<tspan x="625.0" dy="0">greeting_text</tspan>
<tspan x="625.0" dy="20">&quot;Hello Linda&quot;</tspan>
</text><rect x="500" y="500" width="310" height="80" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="655.0" y="536.0" class="mono" text-anchor="middle">
<tspan x="655.0" dy="0">add_support_context()</tspan>
</text><rect x="860" y="500" width="250" height="90" rx="18" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
<text x="985.0" y="541.0" class="mono" text-anchor="middle">
<tspan x="985.0" dy="0">final_prompt</tspan>
<tspan x="985.0" dy="20">ready for model call</tspan>
</text><line x1="265" y1="280" x2="300" y2="335" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="430" y1="380" x2="490" y2="380" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="625" y1="430" x2="650" y2="495" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="810" y1="540" x2="850" y2="540" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="100" y="640" width="1000" height="55" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="125" y="674" class="small" text-anchor="start">
<tspan x="125" dy="0">Common mistake: pass the task object itself. Correct idea: pass the output value or, for large data, pass the file</tspan>
<tspan x="125" dy="18">location.</tspan>
</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Containers">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">Containers make pipeline steps portable</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">A container packages the code and the environment needed to run one component</tspan>
<tspan x="70" dy="24">consistently.</tspan>
</text><circle cx="600" cy="330" r="190" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" filter="url(#shadow)"/>
<rect x="430" y="205" width="340" height="240" rx="18" fill="#F7F8FA" stroke="#5B667A" stroke-width="2"/><rect x="485" y="235" width="230" height="55" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/><text x="600" y="270" class="mono" text-anchor="middle">
<tspan x="600" dy="0">your_code.py</tspan>
</text><rect x="485" y="310" width="230" height="55" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><text x="600" y="345" class="mono" text-anchor="middle">
<tspan x="600" dy="0">dependencies</tspan>
</text><rect x="485" y="385" width="230" height="55" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="600" y="420" class="mono" text-anchor="middle">
<tspan x="600" dy="0">runtime</tspan>
</text><rect x="155" y="610" width="190" height="65" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
<text x="250.0" y="638.5" class="label" text-anchor="middle">
<tspan x="250.0" dy="0">Laptop</tspan>
</text><line x1="600" y1="520" x2="250" y2="600" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="505" y="610" width="190" height="65" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
<text x="600.0" y="638.5" class="label" text-anchor="middle">
<tspan x="600.0" dy="0">CI runner</tspan>
</text><line x1="600" y1="520" x2="600" y2="600" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="855" y="610" width="190" height="65" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
<text x="950.0" y="638.5" class="label" text-anchor="middle">
<tspan x="950.0" dy="0">Cloud job</tspan>
</text><line x1="600" y1="520" x2="950" y2="600" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="570" class="label" text-anchor="middle">
<tspan x="600" dy="0">same container image</tspan>
</text></svg>
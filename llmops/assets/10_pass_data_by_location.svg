<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Passing data by location">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">Pass data by location, not by copying it between steps</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">Large LLM datasets should not travel through memory when a URI is enough.</tspan>
</text><rect x="120" y="240" width="240" height="90" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
<text x="240.0" y="281.0" class="mono" text-anchor="middle">
<tspan x="240.0" dy="0">training_data.json</tspan>
<tspan x="240.0" dy="20">l</tspan>
<tspan x="240.0" dy="20">large file</tspan>
</text><rect x="480" y="240" width="220" height="90" rx="18" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
<text x="590.0" y="281.0" class="mono" text-anchor="middle">
<tspan x="590.0" dy="0">cloud bucket</tspan>
<tspan x="590.0" dy="20">gs://.../train.jso</tspan>
<tspan x="590.0" dy="20">nl</tspan>
</text><rect x="840" y="240" width="220" height="90" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="950.0" y="281.0" class="mono" text-anchor="middle">
<tspan x="950.0" dy="0">tuning job</tspan>
<tspan x="950.0" dy="20">reads URI</tspan>
</text><line x1="360" y1="285" x2="470" y2="285" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="700" y1="285" x2="830" y2="285" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="420" cy="285" r="34" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/>
<line x1="398" y1="263" x2="442" y2="307" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
<text x="420" y="360" class="small" text-anchor="middle">
<tspan x="420" dy="0">Do not pass the whole dataset object through</tspan>
<tspan x="420" dy="18">the pipeline graph.</tspan>
</text><rect x="170" y="510" width="860" height="75" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="200" y="545" class="small" text-anchor="start">
<tspan x="200" dy="0">Pass a location like gs://bucket/train.jsonl or s3://bucket/train.parquet. Then each component can</tspan>
<tspan x="200" dy="20">stream or read the data when needed.</tspan>
</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="LLMOps operating loop">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">LLMOps operating loop</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">LLMOps is the practice of making LLM applications repeatable, testable and safe after the</tspan>
<tspan x="70" dy="24">first demo works.</tspan>
</text><rect x="80" y="185" width="160" height="130" rx="22" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/><text x="160" y="232" class="label" text-anchor="middle">
<tspan x="160" dy="0">Use case</tspan>
</text><text x="160" y="264" class="small" text-anchor="middle">
<tspan x="160" dy="0">What should the</tspan>
<tspan x="160" dy="18">assistant do?</tspan>
</text><rect x="285" y="185" width="160" height="130" rx="22" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/><text x="365" y="232" class="label" text-anchor="middle">
<tspan x="365" dy="0">Data</tspan>
</text><text x="365" y="264" class="small" text-anchor="middle">
<tspan x="365" dy="0">Examples, feedback,</tspan>
<tspan x="365" dy="18">policies</tspan>
</text><rect x="490" y="185" width="160" height="130" rx="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/><text x="570" y="232" class="label" text-anchor="middle">
<tspan x="570" dy="0">Build</tspan>
</text><text x="570" y="264" class="small" text-anchor="middle">
<tspan x="570" dy="0">Prompt, tune,</tspan>
<tspan x="570" dy="18">retrieve, route</tspan>
</text><rect x="695" y="185" width="160" height="130" rx="22" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/><text x="775" y="232" class="label" text-anchor="middle">
<tspan x="775" dy="0">Evaluate</tspan>
</text><text x="775" y="264" class="small" text-anchor="middle">
<tspan x="775" dy="0">Quality, safety, cost,</tspan>
<tspan x="775" dy="18">latency</tspan>
</text><rect x="900" y="185" width="160" height="130" rx="22" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/><text x="980" y="232" class="label" text-anchor="middle">
<tspan x="980" dy="0">Deploy</tspan>
</text><text x="980" y="264" class="small" text-anchor="middle">
<tspan x="980" dy="0">API, batch job, app</tspan>
<tspan x="980" dy="18">integration</tspan>
</text><line x1="250" y1="250" x2="275" y2="250" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="455" y1="250" x2="480" y2="250" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="660" y1="250" x2="685" y2="250" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="865" y1="250" x2="890" y2="250" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M980 330 C960 520 240 520 160 330" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowblue)" stroke-dasharray="9 7"/>
<text x="580" y="555" class="label" text-anchor="middle">
<tspan x="580" dy="0">Monitor → learn → update. The loop is the product.</tspan>
</text><rect x="70" y="620" width="1060" height="50" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="95" y="651" class="small" text-anchor="start">
<tspan x="95" dy="0">Useful mental model: LLMOps is less about one model and more about the controlled loop around data, prompts,</tspan>
<tspan x="95" dy="18">evaluations, deployment and monitoring.</tspan>
</text></svg>
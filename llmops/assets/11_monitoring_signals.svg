<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Monitoring LLM applications">
  <!-- Generated white-background course illustration; source screenshots are references only, not reused. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B667A" />
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #172033; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .tiny { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #5B667A; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #172033; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="70" y="70" class="title">Monitoring: what changes after deployment?</text>
<text x="70" y="105" class="subtitle" text-anchor="start">
<tspan x="70" dy="0">The model can stay the same while users, prompts, data and costs change. Monitoring tells you when the system</tspan>
<tspan x="70" dy="24">is drifting away from expectations.</tspan>
</text><rect x="130" y="210" width="200" height="220" rx="24" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/><text x="230" y="265" class="label" text-anchor="middle">
<tspan x="230" dy="0">Operational</tspan>
</text><text x="230" y="315" class="small" text-anchor="middle">
<tspan x="230" dy="0">latency</tspan>
<tspan x="230" dy="22">errors</tspan>
<tspan x="230" dy="22">throughput</tspan>
</text><rect x="380" y="210" width="200" height="220" rx="24" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/><text x="480" y="265" class="label" text-anchor="middle">
<tspan x="480" dy="0">Cost</tspan>
</text><text x="480" y="315" class="small" text-anchor="middle">
<tspan x="480" dy="0">tokens</tspan>
<tspan x="480" dy="22">cache hits</tspan>
<tspan x="480" dy="22">provider spend</tspan>
</text><rect x="630" y="210" width="200" height="220" rx="24" fill="#D1FAE5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/><text x="730" y="265" class="label" text-anchor="middle">
<tspan x="730" dy="0">Quality</tspan>
</text><text x="730" y="315" class="small" text-anchor="middle">
<tspan x="730" dy="0">eval score</tspan>
<tspan x="730" dy="22">user feedback</tspan>
<tspan x="730" dy="22">regressions</tspan>
</text><rect x="880" y="210" width="200" height="220" rx="24" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/><text x="980" y="265" class="label" text-anchor="middle">
<tspan x="980" dy="0">Safety</tspan>
</text><text x="980" y="315" class="small" text-anchor="middle">
<tspan x="980" dy="0">blocked rate</tspan>
<tspan x="980" dy="22">policy flags</tspan>
<tspan x="980" dy="22">review queue</tspan>
</text><line x1="230" y1="430" x2="230" y2="535" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="430" x2="480" y2="535" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="730" y1="430" x2="730" y2="535" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="980" y1="430" x2="980" y2="535" stroke="#5B667A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="210" y="535" width="810" height="85" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="615" y="570" class="label" text-anchor="middle">
<tspan x="615" dy="0">Trigger actions: alert, rollback, re-run evals, update prompt template, refresh</tspan>
<tspan x="615" dy="22">data, or send to human review.</tspan>
</text></svg>